; ============================================================================
; Configuración oficial de compilación PlatformIO
; Proyecto: Reloj Inteligente Personalizado (ESP32-S3-Touch-AMOLED-2.06)
; Hardware: ESP32-S3R8 (Dual-Core 240MHz, 32MB QIO Flash, 8MB Octal PSRAM)
; ============================================================================

[platformio]
src_dir = firmware
include_dir = firmware

[env:esp32s3_amoled_206]
platform = espressif32 @ 6.9.0
board = esp32-s3-devkitc-1
framework = arduino

; Configuración exacta de Memorias (32MB QIO Flash + 8MB Octal PSRAM)
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.f_cpu = 240000000L
board_upload.flash_size = 32MB
board_upload.maximum_size = 33554432

; Puerto Serie y Velocidades
upload_port = COM5
upload_speed = 921600
monitor_port = COM5
monitor_speed = 115200

; Banderas de Compilación:
; - BOARD_HAS_PSRAM: Activa los 8 MB de RAM extra (Octal PSRAM)
; - ARDUINO_USB_MODE=1 y ARDUINO_USB_CDC_ON_BOOT=1: Mantiene vivo el puerto USB COM5
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1
    -DLV_CONF_INCLUDE_SIMPLE
    -Ifirmware

; Librerías probadas para nuestros chips internos, motor gráfico y parseo JSON en PSRAM
lib_deps =
    lewisxhe/XPowersLib @ ^0.2.6
    lvgl/lvgl @ ^8.3.11
    bblanchon/ArduinoJson @ ^7.2.0

